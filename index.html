<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>For You 💕</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="card">

    <!-- Step 1: verification -->
    <section id="gate">
      <h1>Hi there 💕</h1>
      <p>This page was made for one special person. Please confirm it's you.</p>
      <input id="f-name" type="text" placeholder="Nhập tên VD: Nguyễn Văn A" autocomplete="off">
      <label for="f-dob">Date of birth</label>
      <input id="f-dob" type="date">
      <input id="f-school" type="text" placeholder="Nhập tên trường cấp 3 từng học VD: THPT Chuyên Bắc Ninh" autocomplete="off">
      <button id="verify">Confirm</button>
      <p id="error"></p>
    </section>

    <!-- Step 2: the question (hidden until verified) -->
    <section id="ask" hidden>
    <img src="Love.gif" alt="Loading heart" id="photo">
    <canvas id="heart" width="260" height="240" hidden></canvas>
      <h1 id="title">Ummmmm 💕</h1>
      <p id="message">I have something I want to ask you...</p>
      <h2 id="question">May I have a chance to ask you to hang out with me?</h2>
      <div id="buttons">
        <button id="yes">Yes 💖</button>
        <button id="no">No</button>
      </div>
    </section>

  </main>
  <script src="script.js"></script>
  <script src="heart.js"></script>

</body>
</html>
